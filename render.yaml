databases:
  - name: billflow-db
    databaseName: billplatform_db
    user: bill_user
    plan: free
    postgresMajorVersion: "16"
    region: singapore

services:
  - type: web
    name: billflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: billflow-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: billflow-db
          property: port
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: billflow-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: billflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: billflow-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://billflow-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SPRING_CACHE_TYPE
        value: simple
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: UPLOAD_DIR
        value: ./uploads

  - type: web
    name: billflow-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://billflow-api.onrender.com/api/v1
      - key: VITE_DEMO_MODE
        value: "false"
